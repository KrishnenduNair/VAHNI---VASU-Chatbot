<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>VAHNI Assistant</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>

<div class="phone">
  <div class="header">Chatbot Assistant</div>

  <div class="chat" id="chat">
    <div class="bot">
      Hi! How can I help you with chemistry today?
    </div>
  </div>

  <div class="input-area">
    <input id="input" placeholder="Type your question..." />
    <button onclick="send()">➤</button>
  </div>

  <div class="actions">
    <button onclick="quick('I want to learn a chemistry concept')">Explain Concept</button>
    <button onclick="quick('Solve a chemistry numerical')">Solve Problem</button>
    <button onclick="quick('Suggest chemistry topics')">Suggest Topics</button>
  </div>
</div>

<script>
async function send() {
  const input = document.getElementById("input");
  const text = input.value.trim();
  if (!text) return;

  addMessage(text, "user");
  input.value = "";

  try {
    const res = await fetch(`/chat?query=${encodeURIComponent(text)}`);
    const data = await res.json();
    
    console.log("Got response:", data);  // Debug
    
    // Check if success
    if (data.status === 'success') {
      addMessage(data.response, "bot");
    } else {
      addMessage("Error: " + (data.message || data.response), "bot");
    }
  } catch (err) {
    console.error("Error:", err);
    addMessage("Connection error!", "bot");
  }
}

function quick(text) {
  document.getElementById("input").value = text;
  send();
}

function addMessage(text, who) {
  const chat = document.getElementById("chat");
  const div = document.createElement("div");
  div.className = who;
  div.innerText = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}
</script>

</body>
</html>
